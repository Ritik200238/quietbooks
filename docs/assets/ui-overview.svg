<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141822" />
      <stop offset="100%" stop-color="#0e1118" />
    </linearGradient>
    <filter id="glowCard" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="1100" height="580" rx="12" fill="#090a0f" stroke="#1e2433" stroke-width="1.5" />

  <!-- Title bar -->
  <g transform="translate(40, 28)">
    <text x="0" y="20" font-family="'Newsreader', Georgia, serif" font-size="24" font-weight="500" fill="#ffffff">QuietBooks Web Interface &amp; Surfaces</text>
    <text x="0" y="42" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#7ea0e8">End-to-End React UI &middot; Midnight Lace DApp Connector &middot; Client-Side Proving</text>
  </g>

  <!-- 4 Cards: 2x2 Grid -->
  <g transform="translate(40, 90)">
    <!-- Card 1: Invoices Dashboard -->
    <g transform="translate(0, 0)">
      <rect width="490" height="215" rx="8" fill="url(#cardGrad)" stroke="#222f47" stroke-width="1.2" filter="url(#glowCard)" />
      <!-- Header -->
      <rect width="490" height="36" rx="8" fill="#131926" />
      <circle cx="18" cy="18" r="4" fill="#6cbb8e" />
      <text x="32" y="22" font-family="'IBM Plex Sans', sans-serif" font-size="12.5" font-weight="600" fill="#e7e9ed">Invoices Dashboard &middot; /invoices</text>

      <!-- Mock rows -->
      <g transform="translate(18, 50)">
        <text x="0" y="14" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#7ea0e8">INV-84920</text>
        <rect x="80" y="2" width="60" height="18" rx="9" fill="#163825" />
        <text x="110" y="15" font-family="'IBM Plex Sans', sans-serif" font-size="10" font-weight="600" fill="#6cbb8e" text-anchor="middle">SETTLED</text>
        <text x="160" y="14" font-family="'IBM Plex Mono', monospace" font-size="10.5" fill="#9aa2ae">Buyer: 0x7a3...c91</text>
        <text x="310" y="14" font-family="'IBM Plex Mono', monospace" font-size="10.5" fill="#e7e9ed">5,000.00 NIGHT</text>

        <!-- Divider -->
        <line x1="0" y1="28" x2="454" y2="28" stroke="#1d2638" stroke-width="1" />

        <!-- Row 2: Private to Observer -->
        <text x="0" y="48" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#7ea0e8">INV-84921</text>
        <rect x="80" y="36" width="60" height="18" rx="9" fill="#382d16" />
        <text x="110" y="49" font-family="'IBM Plex Sans', sans-serif" font-size="10" font-weight="600" fill="#d3a55c" text-anchor="middle">OPEN</text>
        <text x="160" y="48" font-family="'IBM Plex Mono', monospace" font-size="10.5" fill="#9aa2ae">Buyer: 0x4f2...81b</text>
        <rect x="310" y="36" width="125" height="18" rx="4" fill="#19202f" />
        <text x="372" y="49" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#7ea0e8" text-anchor="middle">&#128274; Amount Hidden</text>

        <!-- Divider -->
        <line x1="0" y1="62" x2="454" y2="62" stroke="#1d2638" stroke-width="1" />

        <!-- Row 3: In Escrow -->
        <text x="0" y="82" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#7ea0e8">INV-84922</text>
        <rect x="80" y="70" width="60" height="18" rx="9" fill="#36221d" />
        <text x="110" y="83" font-family="'IBM Plex Sans', sans-serif" font-size="10" font-weight="600" fill="#d97b72" text-anchor="middle">ESCROW</text>
        <text x="160" y="82" font-family="'IBM Plex Mono', monospace" font-size="10.5" fill="#9aa2ae">Arbiter: 0x9e1...12a</text>
        <text x="310" y="82" font-family="'IBM Plex Mono', monospace" font-size="10.5" fill="#d3a55c">12,500.00 (Public)</text>

        <!-- Note -->
        <text x="0" y="125" font-family="'IBM Plex Sans', sans-serif" font-size="11" fill="#9aa2ae">Honest multi-role explorer: Shows public anchors &amp; shields unowned terms.</text>
      </g>
    </g>

    <!-- Card 2: New Invoice Creation -->
    <g transform="translate(530, 0)">
      <rect width="490" height="215" rx="8" fill="url(#cardGrad)" stroke="#222f47" stroke-width="1.2" filter="url(#glowCard)" />
      <!-- Header -->
      <rect width="490" height="36" rx="8" fill="#131926" />
      <circle cx="18" cy="18" r="4" fill="#7ea0e8" />
      <text x="32" y="22" font-family="'IBM Plex Sans', sans-serif" font-size="12.5" font-weight="600" fill="#e7e9ed">Invoice Creator &middot; /invoices/new</text>

      <g transform="translate(18, 50)">
        <rect width="215" height="32" rx="4" fill="#0c1017" stroke="#222f47" />
        <text x="10" y="20" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#9aa2ae">Total: 8,400.00 NIGHT</text>

        <rect x="230" width="224" height="32" rx="4" fill="#0c1017" stroke="#222f47" />
        <text x="240" y="20" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#9aa2ae">Tax: 840.00 (10%)</text>

        <rect y="42" width="454" height="32" rx="4" fill="#0c1017" stroke="#222f47" />
        <text x="10" y="62" font-family="'IBM Plex Mono', monospace" font-size="10.5" fill="#7ea0e8">sellerPayout: 0x48a...e91 &middot; buyerPayout: 0x12b...f02</text>

        <rect y="84" width="454" height="28" rx="4" fill="#0c1017" stroke="#222f47" />
        <text x="10" y="102" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#9aa2ae">Item 1: Smart contract security review (120 hrs) &middot; Memo: Phase 1</text>

        <text x="0" y="142" font-family="'IBM Plex Sans', sans-serif" font-size="11" fill="#6cbb8e">&check; Derives 9 blinding salts, terms digest &amp; field root locally before issue.</text>
      </g>
    </g>

    <!-- Card 3: Shielded Settlement & Escrow Detail -->
    <g transform="translate(0, 235)">
      <rect width="490" height="225" rx="8" fill="url(#cardGrad)" stroke="#222f47" stroke-width="1.2" filter="url(#glowCard)" />
      <!-- Header -->
      <rect width="490" height="36" rx="8" fill="#131926" />
      <circle cx="18" cy="18" r="4" fill="#6cbb8e" />
      <text x="32" y="22" font-family="'IBM Plex Sans', sans-serif" font-size="12.5" font-weight="600" fill="#e7e9ed">Settlement &amp; Escrow Modal &middot; /invoices/:id</text>

      <g transform="translate(18, 50)">
        <rect width="454" height="42" rx="6" fill="#112219" stroke="#1f4d34" />
        <text x="12" y="20" font-family="'IBM Plex Sans', sans-serif" font-size="12" font-weight="600" fill="#6cbb8e">&#9889; settleWithNote (Atomic Shielded Transfer)</text>
        <text x="12" y="34" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#9aa2ae">Passes coin straight through Zswap &middot; Contract balance stays 0 &middot; Amount hidden</text>

        <rect y="50" width="454" height="36" rx="6" fill="#1a1c26" stroke="#2b344a" />
        <text x="12" y="68" font-family="'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="600" fill="#7ea0e8">&#128221; settleAttested (Seller Bank Attestation)</text>
        <text x="12" y="80" font-family="'IBM Plex Mono', monospace" font-size="9.5" fill="#9aa2ae">Vouches receipt of wire / fiat without revealing amount</text>

        <rect y="94" width="454" height="36" rx="6" fill="#241e15" stroke="#4a3b22" />
        <text x="12" y="112" font-family="'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="600" fill="#d3a55c">&#128274; fundEscrow &rarr; releaseEscrow / dispute</text>
        <text x="12" y="124" font-family="'IBM Plex Mono', monospace" font-size="9.5" fill="#9aa2ae">Explicit public custody &middot; Bound to sellerPayout &amp; buyerPayout</text>
      </g>
    </g>

    <!-- Card 4: Selective Audit Console -->
    <g transform="translate(530, 235)">
      <rect width="490" height="225" rx="8" fill="url(#cardGrad)" stroke="#222f47" stroke-width="1.2" filter="url(#glowCard)" />
      <!-- Header -->
      <rect width="490" height="36" rx="8" fill="#131926" />
      <circle cx="18" cy="18" r="4" fill="#7ea0e8" />
      <text x="32" y="22" font-family="'IBM Plex Sans', sans-serif" font-size="12.5" font-weight="600" fill="#e7e9ed">Selective Audit Console &middot; /audit</text>

      <g transform="translate(18, 50)">
        <text x="0" y="14" font-family="'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="600" fill="#e7e9ed">8-Stage Envelope Verification Report:</text>
        
        <g transform="translate(0, 24)">
          <text x="0" y="12" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#6cbb8e">&#10003; 1. Schema: quietbooks-audit/2</text>
          <text x="230" y="12" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#6cbb8e">&#10003; 2. Grant not revoked</text>

          <text x="0" y="30" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#6cbb8e">&#10003; 3. Expiry timestamp valid</text>
          <text x="230" y="30" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#6cbb8e">&#10003; 4. Key hash pre-image match</text>

          <text x="0" y="48" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#6cbb8e">&#10003; 5. Containment (Zero Smuggling)</text>
          <text x="230" y="48" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#6cbb8e">&#10003; 6. AES-GCM Decryption pass</text>

          <text x="0" y="66" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#6cbb8e">&#10003; 7. Field commitments recomputed</text>
          <text x="230" y="66" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#6cbb8e">&#10003; 8. Merkle root folds to chain</text>
        </g>

        <rect y="104" width="454" height="28" rx="4" fill="#0c1017" stroke="#1d2638" />
        <text x="10" y="122" font-family="'IBM Plex Mono', monospace" font-size="10.5" fill="#6cbb8e">Disclosed: Amount (8,400 NIGHT), Tax (840 NIGHT) &middot; Items: OPAQUE</text>
      </g>
    </g>
  </g>
</svg>
