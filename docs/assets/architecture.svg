<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="100%" height="100%">
  <defs>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141824" />
      <stop offset="100%" stop-color="#0c0e14" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3e63b8" />
      <stop offset="100%" stop-color="#7ea0e8" />
    </linearGradient>
    <linearGradient id="okGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#235c3c" />
      <stop offset="100%" stop-color="#388a5b" />
    </linearGradient>
    <linearGradient id="warnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6e4f16" />
      <stop offset="100%" stop-color="#a67724" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1100" height="520" rx="12" fill="#090b0f" stroke="#1e2433" stroke-width="1.5" />

  <!-- Section: Private Witness State (Left) -->
  <g transform="translate(35, 35)">
    <rect width="320" height="450" rx="10" fill="url(#panelGrad)" stroke="#274636" stroke-width="1.5" filter="url(#shadow)" />
    <!-- Header -->
    <path d="M 0 10 Q 0 0 10 0 L 310 0 Q 320 0 320 10 L 320 44 L 0 44 Z" fill="#13261c" />
    <circle cx="24" cy="22" r="5" fill="#6cbb8e" />
    <text x="38" y="27" font-family="'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#6cbb8e" letter-spacing="0.5">LOCAL PRIVATE WITNESS STATE</text>
    <text x="38" y="38" font-family="'IBM Plex Mono', monospace" font-size="9.5" fill="#9aa2ae">(Never touches the chain)</text>

    <!-- Content Items -->
    <g transform="translate(20, 65)">
      <!-- Item 1 -->
      <rect width="280" height="52" rx="6" fill="#0f141a" stroke="#1d2822" />
      <text x="14" y="22" font-family="'IBM Plex Sans', sans-serif" font-size="12" font-weight="600" fill="#e7e9ed">Commercial Terms &amp; Amounts</text>
      <text x="14" y="40" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#6cbb8e">amount &middot; tax &middot; line items &middot; memo</text>
      
      <!-- Item 2 -->
      <rect y="64" width="280" height="52" rx="6" fill="#0f141a" stroke="#1d2822" />
      <text x="14" y="86" font-family="'IBM Plex Sans', sans-serif" font-size="12" font-weight="600" fill="#e7e9ed">Payout Binding Secrets</text>
      <text x="14" y="104" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#6cbb8e">sellerPayout &middot; buyerPayout &middot; tokenType</text>

      <!-- Item 3 -->
      <rect y="128" width="280" height="74" rx="6" fill="#0f141a" stroke="#1d2822" />
      <text x="14" y="150" font-family="'IBM Plex Sans', sans-serif" font-size="12" font-weight="600" fill="#e7e9ed">9 Disclosable Salts (Blinding)</text>
      <text x="14" y="168" font-family="'IBM Plex Mono', monospace" font-size="10.5" fill="#9aa2ae">saltAmount, saltTax, saltDue...</text>
      <text x="14" y="186" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#7ea0e8">&rarr; folded into 9-field root</text>

      <!-- Item 4: Encrypted Envelope -->
      <rect y="214" width="280" height="90" rx="6" fill="#111827" stroke="#3e63b8" stroke-dasharray="3,3" />
      <text x="14" y="238" font-family="'IBM Plex Sans', sans-serif" font-size="12" font-weight="600" fill="#7ea0e8">Selective Audit Envelope</text>
      <text x="14" y="256" font-family="'IBM Plex Mono', monospace" font-size="10.5" fill="#e7e9ed">AES-256-GCM Out-of-Band</text>
      <text x="14" y="274" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#9aa2ae">Shares only granted field salts</text>
      <text x="14" y="292" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#6cbb8e">&check; Canonical byte serialization</text>

      <!-- Identity note -->
      <rect y="316" width="280" height="52" rx="6" fill="#0f141a" stroke="#1d2822" />
      <text x="14" y="338" font-family="'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="600" fill="#e7e9ed">Identity Secret &amp; PIN</text>
      <text x="14" y="354" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#9aa2ae">partyKey = hash([salt, pin, secret])</text>
    </g>
  </g>

  <!-- Arrow Middle 1: ZK Proving -->
  <g transform="translate(365, 230)">
    <line x1="0" y1="0" x2="60" y2="0" stroke="#7ea0e8" stroke-width="2" stroke-dasharray="4,4" />
    <polygon points="60,0 52,-5 52,5" fill="#7ea0e8" />
    <text x="30" y="-10" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#7ea0e8" text-anchor="middle">ZK PROOF</text>
  </g>

  <!-- Section: Smart Contract Circuits & Logic (Middle) -->
  <g transform="translate(435, 35)">
    <rect width="280" height="450" rx="10" fill="url(#panelGrad)" stroke="#3e63b8" stroke-width="1.5" filter="url(#shadow)" />
    <path d="M 0 10 Q 0 0 10 0 L 270 0 Q 280 0 280 10 L 280 44 L 0 44 Z" fill="#141c2e" />
    <circle cx="24" cy="22" r="5" fill="#7ea0e8" />
    <text x="38" y="27" font-family="'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#7ea0e8" letter-spacing="0.5">COMPACT 0.23 CIRCUITS</text>
    <text x="38" y="38" font-family="'IBM Plex Mono', monospace" font-size="9.5" fill="#9aa2ae">(12 Entry Points / Block Write Gated)</text>

    <!-- Circuits Content -->
    <g transform="translate(16, 65)">
      <!-- Circuit 1 -->
      <rect width="248" height="68" rx="6" fill="#101522" stroke="#222f47" />
      <text x="12" y="22" font-family="'IBM Plex Mono', monospace" font-size="11.5" font-weight="600" fill="#7ea0e8">issueInvoice()</text>
      <text x="12" y="40" font-family="'IBM Plex Sans', sans-serif" font-size="10.5" fill="#e7e9ed">Verifies &amp; anchors commitments</text>
      <text x="12" y="56" font-family="'IBM Plex Mono', monospace" font-size="9.5" fill="#9aa2ae">Enforces seller/buyer payout bindings</text>

      <!-- Circuit 2 -->
      <rect y="78" width="248" height="88" rx="6" fill="#101522" stroke="#222f47" />
      <text x="12" y="100" font-family="'IBM Plex Mono', monospace" font-size="11.5" font-weight="600" fill="#6cbb8e">settleWithNote()</text>
      <text x="12" y="118" font-family="'IBM Plex Sans', sans-serif" font-size="10.5" fill="#e7e9ed">Atomic Shielded Passthrough</text>
      <text x="12" y="134" font-family="'IBM Plex Mono', monospace" font-size="9.5" fill="#9aa2ae">receiveShielded &rarr; sendImmediate</text>
      <text x="12" y="150" font-family="'IBM Plex Mono', monospace" font-size="9.5" fill="#6cbb8e">&check; Contract balance change: 0</text>

      <!-- Circuit 3 -->
      <rect y="176" width="248" height="74" rx="6" fill="#101522" stroke="#222f47" />
      <text x="12" y="198" font-family="'IBM Plex Mono', monospace" font-size="11.5" font-weight="600" fill="#d3a55c">fundEscrow() / release()</text>
      <text x="12" y="216" font-family="'IBM Plex Sans', sans-serif" font-size="10.5" fill="#e7e9ed">Public Custody Escrow Rail</text>
      <text x="12" y="234" font-family="'IBM Plex Mono', monospace" font-size="9.5" fill="#9aa2ae">Refund deadline + Arbiter ruling</text>

      <!-- Circuit 4 -->
      <rect y="260" width="248" height="64" rx="6" fill="#101522" stroke="#222f47" />
      <text x="12" y="282" font-family="'IBM Plex Mono', monospace" font-size="11.5" font-weight="600" fill="#7ea0e8">grantAudit() / revoke()</text>
      <text x="12" y="300" font-family="'IBM Plex Sans', sans-serif" font-size="10.5" fill="#e7e9ed">Records auditKeyHash + 9-bit scope</text>
      <text x="12" y="314" font-family="'IBM Plex Mono', monospace" font-size="9.5" fill="#9aa2ae">Enforces blockTimeLessThan(expiry)</text>

      <!-- Circuit 5 -->
      <rect y="334" width="248" height="42" rx="6" fill="#101522" stroke="#222f47" />
      <text x="12" y="354" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="600" fill="#e7e9ed">settleAttested()</text>
      <text x="12" y="368" font-family="'IBM Plex Sans', sans-serif" font-size="9.5" fill="#9aa2ae">Seller vouch for bank rails</text>
    </g>
  </g>

  <!-- Arrow Middle 2: Writes to Ledger -->
  <g transform="translate(725, 230)">
    <line x1="0" y1="0" x2="55" y2="0" stroke="#d3a55c" stroke-width="2" />
    <polygon points="55,0 47,-5 47,5" fill="#d3a55c" />
    <text x="27" y="-10" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#d3a55c" text-anchor="middle">STATE</text>
  </g>

  <!-- Section: Public Ledger State (Right) -->
  <g transform="translate(790, 35)">
    <rect width="275" height="450" rx="10" fill="url(#panelGrad)" stroke="#825c1b" stroke-width="1.5" filter="url(#shadow)" />
    <path d="M 0 10 Q 0 0 10 0 L 265 0 Q 275 0 275 10 L 275 44 L 0 44 Z" fill="#241a0d" />
    <circle cx="24" cy="22" r="5" fill="#d3a55c" />
    <text x="38" y="27" font-family="'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#d3a55c" letter-spacing="0.5">PUBLIC LEDGER STATE</text>
    <text x="38" y="38" font-family="'IBM Plex Mono', monospace" font-size="9.5" fill="#9aa2ae">(Explorer &amp; Indexer Visible)</text>

    <!-- Ledger Content -->
    <g transform="translate(16, 65)">
      <!-- Item 1 -->
      <rect width="243" height="78" rx="6" fill="#14110b" stroke="#362914" />
      <text x="12" y="22" font-family="'IBM Plex Sans', sans-serif" font-size="12" font-weight="600" fill="#e7e9ed">Invoice Lifecycle Anchor</text>
      <text x="12" y="40" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#d3a55c">status: issued|settled|escrow...</text>
      <text x="12" y="56" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#9aa2ae">issuedAt, dueAt (timestamps)</text>
      <text x="12" y="70" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#9aa2ae">sellerKey, buyerKey (pseudonyms)</text>

      <!-- Item 2 -->
      <rect y="90" width="243" height="74" rx="6" fill="#14110b" stroke="#362914" />
      <text x="12" y="112" font-family="'IBM Plex Sans', sans-serif" font-size="12" font-weight="600" fill="#e7e9ed">4 Immutable Digests (32B)</text>
      <text x="12" y="128" font-family="'IBM Plex Mono', monospace" font-size="9.5" fill="#d3a55c">1. termsCommitment</text>
      <text x="12" y="142" font-family="'IBM Plex Mono', monospace" font-size="9.5" fill="#d3a55c">2. fieldCommitmentRoot</text>
      <text x="12" y="156" font-family="'IBM Plex Mono', monospace" font-size="9.5" fill="#d3a55c">3. settlementDigest &middot; 4. escrow</text>

      <!-- Item 3 -->
      <rect y="174" width="243" height="66" rx="6" fill="#14110b" stroke="#362914" />
      <text x="12" y="196" font-family="'IBM Plex Sans', sans-serif" font-size="12" font-weight="600" fill="#e7e9ed">Audit Authorizations</text>
      <text x="12" y="214" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#d3a55c">auditKeyHash (digest only)</text>
      <text x="12" y="228" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#9aa2ae">scopeMask [9 bits], expiresAt</text>

      <!-- Item 4 -->
      <rect y="250" width="243" height="68" rx="6" fill="#14110b" stroke="#362914" />
      <text x="12" y="272" font-family="'IBM Plex Sans', sans-serif" font-size="12" font-weight="600" fill="#e7e9ed">Reliability Ledger</text>
      <text x="12" y="290" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#d3a55c">settled, onTime, cancelled</text>
      <text x="12" y="304" font-family="'IBM Plex Mono', monospace" font-size="9.5" fill="#9aa2ae">disputesOpened, disputesLost</text>

      <!-- Item 5 -->
      <rect y="328" width="243" height="48" rx="6" fill="#14110b" stroke="#362914" />
      <text x="12" y="348" font-family="'IBM Plex Sans', sans-serif" font-size="11" font-weight="600" fill="#e7e9ed">Network Globals</text>
      <text x="12" y="364" font-family="'IBM Plex Mono', monospace" font-size="9.5" fill="#9aa2ae">instanceSalt &middot; adminKey &middot; paused</text>
    </g>
  </g>
</svg>
