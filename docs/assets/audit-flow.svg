<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" width="100%" height="100%">
  <defs>
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101522" />
      <stop offset="100%" stop-color="#0a0d14" />
    </linearGradient>
    <filter id="boxShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="1100" height="480" rx="12" fill="#090b0f" stroke="#1e2433" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(40, 30)">
    <text x="0" y="20" font-family="'Newsreader', Georgia, serif" font-size="24" font-weight="500" fill="#ffffff">The 8-Stage Selective Audit Engine</text>
    <text x="0" y="42" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#7ea0e8">Cryptographic Envelope &middot; Out-of-Band Exchange &middot; Canonical Byte Verification</text>
  </g>

  <!-- Flow Boxes: 1 to 4 on top row, 5 to 8 on bottom row -->
  <g transform="translate(40, 95)">
    <!-- Stage 1 -->
    <g transform="translate(0, 0)">
      <rect width="235" height="150" rx="8" fill="url(#flowGrad)" stroke="#222f47" stroke-width="1.2" filter="url(#boxShadow)" />
      <circle cx="24" cy="24" r="12" fill="#1b2a45" stroke="#3e63b8" />
      <text x="24" y="28" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="600" fill="#7ea0e8" text-anchor="middle">1</text>
      <text x="46" y="28" font-family="'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#e7e9ed">Format Version</text>
      <text x="16" y="60" font-family="'IBM Plex Sans', sans-serif" font-size="11" fill="#9aa2ae">Enforces schema version</text>
      <text x="16" y="78" font-family="'IBM Plex Mono', monospace" font-size="10.5" fill="#7ea0e8">quietbooks-audit/2</text>
      <text x="16" y="105" font-family="'IBM Plex Sans', sans-serif" font-size="10.5" fill="#6cbb8e">&check; Refuses legacy v1 by name</text>
    </g>

    <!-- Stage 2 -->
    <g transform="translate(260, 0)">
      <rect width="235" height="150" rx="8" fill="url(#flowGrad)" stroke="#222f47" stroke-width="1.2" filter="url(#boxShadow)" />
      <circle cx="24" cy="24" r="12" fill="#1b2a45" stroke="#3e63b8" />
      <text x="24" y="28" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="600" fill="#7ea0e8" text-anchor="middle">2</text>
      <text x="46" y="28" font-family="'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#e7e9ed">Grant Not Revoked</text>
      <text x="16" y="60" font-family="'IBM Plex Sans', sans-serif" font-size="11" fill="#9aa2ae">Reads on-chain ledger</text>
      <text x="16" y="78" font-family="'IBM Plex Mono', monospace" font-size="10.5" fill="#7ea0e8">grant.revoked == false</text>
      <text x="16" y="105" font-family="'IBM Plex Sans', sans-serif" font-size="10.5" fill="#6cbb8e">&check; Immediate revocation check</text>
    </g>

    <!-- Stage 3 -->
    <g transform="translate(520, 0)">
      <rect width="235" height="150" rx="8" fill="url(#flowGrad)" stroke="#222f47" stroke-width="1.2" filter="url(#boxShadow)" />
      <circle cx="24" cy="24" r="12" fill="#1b2a45" stroke="#3e63b8" />
      <text x="24" y="28" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="600" fill="#7ea0e8" text-anchor="middle">3</text>
      <text x="46" y="28" font-family="'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#e7e9ed">Expiry Check</text>
      <text x="16" y="60" font-family="'IBM Plex Sans', sans-serif" font-size="11" fill="#9aa2ae">Validates against block clock</text>
      <text x="16" y="78" font-family="'IBM Plex Mono', monospace" font-size="10.5" fill="#7ea0e8">currentTime &lt; grant.expiresAt</text>
      <text x="16" y="105" font-family="'IBM Plex Sans', sans-serif" font-size="10.5" fill="#6cbb8e">&check; Time-bounded disclosure</text>
    </g>

    <!-- Stage 4 -->
    <g transform="translate(780, 0)">
      <rect width="235" height="150" rx="8" fill="url(#flowGrad)" stroke="#222f47" stroke-width="1.2" filter="url(#boxShadow)" />
      <circle cx="24" cy="24" r="12" fill="#1b2a45" stroke="#3e63b8" />
      <text x="24" y="28" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="600" fill="#7ea0e8" text-anchor="middle">4</text>
      <text x="46" y="28" font-family="'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#e7e9ed">Key Hash Match</text>
      <text x="16" y="60" font-family="'IBM Plex Sans', sans-serif" font-size="11" fill="#9aa2ae">Proves out-of-band key preimage</text>
      <text x="16" y="78" font-family="'IBM Plex Mono', monospace" font-size="10.5" fill="#7ea0e8">sha256(key) == onChainHash</text>
      <text x="16" y="105" font-family="'IBM Plex Sans', sans-serif" font-size="10.5" fill="#6cbb8e">&check; Prevents unanchored keys</text>
    </g>

    <!-- Stage 5: Containment (Highlighted!) -->
    <g transform="translate(0, 180)">
      <rect width="235" height="165" rx="8" fill="#141824" stroke="#6cbb8e" stroke-width="1.6" filter="url(#boxShadow)" />
      <circle cx="24" cy="24" r="12" fill="#163825" stroke="#6cbb8e" />
      <text x="24" y="28" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="600" fill="#6cbb8e" text-anchor="middle">5</text>
      <text x="46" y="28" font-family="'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#6cbb8e">Scope Containment</text>
      <text x="16" y="58" font-family="'IBM Plex Sans', sans-serif" font-size="11" fill="#e7e9ed">Refuses extra smuggled fields</text>
      <text x="16" y="76" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#d3a55c">Canonical byte serialization:</text>
      <text x="16" y="92" font-family="'IBM Plex Mono', monospace" font-size="9.5" fill="#9aa2ae">reserialize(parse) === decrypted</text>
      <text x="16" y="118" font-family="'IBM Plex Sans', sans-serif" font-size="10.5" fill="#6cbb8e">&check; Defeats JSON parse attacks</text>
      <text x="16" y="136" font-family="'IBM Plex Sans', sans-serif" font-size="10" fill="#9aa2ae">Zero leaked unauthorized salts</text>
    </g>

    <!-- Stage 6 -->
    <g transform="translate(260, 180)">
      <rect width="235" height="165" rx="8" fill="url(#flowGrad)" stroke="#222f47" stroke-width="1.2" filter="url(#boxShadow)" />
      <circle cx="24" cy="24" r="12" fill="#1b2a45" stroke="#3e63b8" />
      <text x="24" y="28" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="600" fill="#7ea0e8" text-anchor="middle">6</text>
      <text x="46" y="28" font-family="'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#e7e9ed">Payload Decryption</text>
      <text x="16" y="58" font-family="'IBM Plex Sans', sans-serif" font-size="11" fill="#9aa2ae">AES-256-GCM authenticated</text>
      <text x="16" y="76" font-family="'IBM Plex Mono', monospace" font-size="10.5" fill="#7ea0e8">tag + ciphertext verification</text>
      <text x="16" y="105" font-family="'IBM Plex Sans', sans-serif" font-size="10.5" fill="#6cbb8e">&check; AAD covers integrity digests</text>
    </g>

    <!-- Stage 7 -->
    <g transform="translate(520, 180)">
      <rect width="235" height="165" rx="8" fill="url(#flowGrad)" stroke="#222f47" stroke-width="1.2" filter="url(#boxShadow)" />
      <circle cx="24" cy="24" r="12" fill="#1b2a45" stroke="#3e63b8" />
      <text x="24" y="28" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="600" fill="#7ea0e8" text-anchor="middle">7</text>
      <text x="46" y="28" font-family="'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#e7e9ed">Field Commitments</text>
      <text x="16" y="58" font-family="'IBM Plex Sans', sans-serif" font-size="11" fill="#9aa2ae">Recomputes commitments</text>
      <text x="16" y="76" font-family="'IBM Plex Mono', monospace" font-size="10.5" fill="#7ea0e8">hash([tag, salt, value])</text>
      <text x="16" y="105" font-family="'IBM Plex Sans', sans-serif" font-size="10.5" fill="#6cbb8e">&check; Byte-identical to circuit</text>
    </g>

    <!-- Stage 8 -->
    <g transform="translate(780, 180)">
      <rect width="235" height="165" rx="8" fill="url(#flowGrad)" stroke="#222f47" stroke-width="1.2" filter="url(#boxShadow)" />
      <circle cx="24" cy="24" r="12" fill="#1b2a45" stroke="#3e63b8" />
      <text x="24" y="28" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="600" fill="#7ea0e8" text-anchor="middle">8</text>
      <text x="46" y="28" font-family="'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#e7e9ed">Merkle Root Fold</text>
      <text x="16" y="58" font-family="'IBM Plex Sans', sans-serif" font-size="11" fill="#9aa2ae">Folds 9 field digests</text>
      <text x="16" y="76" font-family="'IBM Plex Mono', monospace" font-size="10.5" fill="#7ea0e8">foldedRoot === onChainRoot</text>
      <text x="16" y="105" font-family="'IBM Plex Sans', sans-serif" font-size="10.5" fill="#6cbb8e">&check; Full cryptographic binding</text>
    </g>
  </g>
</svg>
