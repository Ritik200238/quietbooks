<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgG4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b0e14" />
      <stop offset="100%" stop-color="#07080c" />
    </linearGradient>
  </defs>

  <rect width="1000" height="600" fill="url(#bgG4)" rx="12" stroke="#1b2130" stroke-width="1.5" />

  <!-- Browser Chrome -->
  <rect width="1000" height="42" fill="#121622" rx="12" />
  <circle cx="24" cy="21" r="5" fill="#d97b72" />
  <circle cx="40" cy="21" r="5" fill="#d3a55c" />
  <circle cx="56" cy="21" r="5" fill="#6cbb8e" />
  <rect x="250" y="10" width="500" height="22" rx="6" fill="#080a0f" stroke="#1f283d" stroke-width="1" />
  <text x="500" y="25" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#7ea0e8" text-anchor="middle">https://quietbooks.network/audit &middot; Auditor Verification Portal</text>

  <!-- Container -->
  <g transform="translate(40, 60)">
    <text x="0" y="28" font-family="'Newsreader', Georgia, serif" font-size="28" font-weight="500" fill="#ffffff">Cryptographic Audit Verification Console</text>
    <text x="0" y="48" font-family="'IBM Plex Sans', sans-serif" font-size="12" fill="#9aa2ae">8-Stage envelope verification &middot; Proves disclosed numbers match on-chain commitment without leaking ungranted fields</text>

    <!-- Content Grid -->
    <g transform="translate(0, 65)">
      <!-- Left: Verification Report (8 Checks) -->
      <rect width="470" height="400" rx="8" fill="#0d111a" stroke="#1c2438" stroke-width="1" />
      <text x="20" y="30" font-family="'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#7ea0e8">CANONICAL ENVELOPE VERIFICATION (8/8 PASS)</text>

      <!-- 8 Check Rows -->
      <g transform="translate(20, 48)">
        <!-- 1 -->
        <circle cx="10" cy="12" r="8" fill="#163825" />
        <text x="10" y="16" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#6cbb8e" text-anchor="middle">&#10003;</text>
        <text x="28" y="16" font-family="'IBM Plex Sans', sans-serif" font-size="11.5" fill="#e7e9ed">Check 1: Envelope schema version</text>
        <text x="430" y="16" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#6cbb8e" text-anchor="end">quietbooks-audit/2</text>
        <line x1="0" y1="28" x2="430" y2="28" stroke="#161c28" />

        <!-- 2 -->
        <circle cx="10" cy="40" r="8" fill="#163825" />
        <text x="10" y="44" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#6cbb8e" text-anchor="middle">&#10003;</text>
        <text x="28" y="44" font-family="'IBM Plex Sans', sans-serif" font-size="11.5" fill="#e7e9ed">Check 2: Grant active on-chain</text>
        <text x="430" y="44" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#6cbb8e" text-anchor="end">not revoked</text>
        <line x1="0" y1="56" x2="430" y2="56" stroke="#161c28" />

        <!-- 3 -->
        <circle cx="10" cy="68" r="8" fill="#163825" />
        <text x="10" y="72" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#6cbb8e" text-anchor="middle">&#10003;</text>
        <text x="28" y="72" font-family="'IBM Plex Sans', sans-serif" font-size="11.5" fill="#e7e9ed">Check 3: Time-bounded expiry</text>
        <text x="430" y="72" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#6cbb8e" text-anchor="end">valid (expires 2026-11)</text>
        <line x1="0" y1="84" x2="430" y2="84" stroke="#161c28" />

        <!-- 4 -->
        <circle cx="10" cy="96" r="8" fill="#163825" />
        <text x="10" y="100" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#6cbb8e" text-anchor="middle">&#10003;</text>
        <text x="28" y="100" font-family="'IBM Plex Sans', sans-serif" font-size="11.5" fill="#e7e9ed">Check 4: Key hash preimage</text>
        <text x="430" y="100" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#6cbb8e" text-anchor="end">sha256 matches anchor</text>
        <line x1="0" y1="112" x2="430" y2="112" stroke="#161c28" />

        <!-- 5: Containment Highlight! -->
        <circle cx="10" cy="124" r="8" fill="#163825" stroke="#6cbb8e" stroke-width="1.5" />
        <text x="10" y="128" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#6cbb8e" text-anchor="middle">&#10003;</text>
        <text x="28" y="128" font-family="'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="600" fill="#6cbb8e">Check 5: Strict scope containment</text>
        <text x="430" y="128" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#6cbb8e" text-anchor="end">0 smuggled fields</text>
        <line x1="0" y1="140" x2="430" y2="140" stroke="#161c28" />

        <!-- 6 -->
        <circle cx="10" cy="152" r="8" fill="#163825" />
        <text x="10" y="156" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#6cbb8e" text-anchor="middle">&#10003;</text>
        <text x="28" y="156" font-family="'IBM Plex Sans', sans-serif" font-size="11.5" fill="#e7e9ed">Check 6: AES-256-GCM payload decrypt</text>
        <text x="430" y="156" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#6cbb8e" text-anchor="end">auth tag valid</text>
        <line x1="0" y1="168" x2="430" y2="168" stroke="#161c28" />

        <!-- 7 -->
        <circle cx="10" cy="180" r="8" fill="#163825" />
        <text x="10" y="184" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#6cbb8e" text-anchor="middle">&#10003;</text>
        <text x="28" y="184" font-family="'IBM Plex Sans', sans-serif" font-size="11.5" fill="#e7e9ed">Check 7: Per-field salt commitments</text>
        <text x="430" y="184" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#6cbb8e" text-anchor="end">recomputed = true</text>
        <line x1="0" y1="196" x2="430" y2="196" stroke="#161c28" />

        <!-- 8 -->
        <circle cx="10" cy="208" r="8" fill="#163825" />
        <text x="10" y="212" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#6cbb8e" text-anchor="middle">&#10003;</text>
        <text x="28" y="212" font-family="'IBM Plex Sans', sans-serif" font-size="11.5" fill="#e7e9ed">Check 8: 9-Field Merkle root folding</text>
        <text x="430" y="212" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#6cbb8e" text-anchor="end">root === onChainRoot</text>
      </g>

      <!-- Overall Status pill -->
      <g transform="translate(20, 290)">
        <rect width="430" height="42" rx="6" fill="#112217" stroke="#235c3c" />
        <text x="215" y="26" font-family="'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#6cbb8e" text-anchor="middle">&#10003; VERIFIED LEGITIMATE: Cryptographically Bound to Ledger</text>
      </g>

      <!-- Right: Decrypted Plaintexts vs Opaque Blinds -->
      <rect x="490" width="430" height="400" rx="8" fill="#0d111a" stroke="#1c2438" stroke-width="1" />
      <text x="510" y="30" font-family="'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#7ea0e8">DECRYPTED DATA &amp; SCOPE ISOLATION</text>

      <g transform="translate(510, 50)">
        <!-- Disclosed Field 1 -->
        <rect width="390" height="44" rx="4" fill="#121d18" stroke="#1e4732" />
        <text x="14" y="20" font-family="'IBM Plex Sans', sans-serif" font-size="10.5" fill="#9aa2ae">FIELD: AMOUNT (DISCLOSED)</text>
        <text x="14" y="36" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="600" fill="#6cbb8e">8,400.00 NIGHT</text>
        <text x="376" y="28" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#6cbb8e" text-anchor="end">&#128275; Salt Verified</text>

        <!-- Disclosed Field 2 -->
        <rect y="52" width="390" height="44" rx="4" fill="#121d18" stroke="#1e4732" />
        <text x="14" y="72" font-family="'IBM Plex Sans', sans-serif" font-size="10.5" fill="#9aa2ae">FIELD: TAX / VAT (DISCLOSED)</text>
        <text x="14" y="88" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="600" fill="#6cbb8e">840.00 NIGHT (10%)</text>
        <text x="376" y="80" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#6cbb8e" text-anchor="end">&#128275; Salt Verified</text>

        <!-- Opaque Field 3 -->
        <rect y="104" width="390" height="44" rx="4" fill="#141822" stroke="#222b3d" />
        <text x="14" y="124" font-family="'IBM Plex Sans', sans-serif" font-size="10.5" fill="#9aa2ae">FIELD: LINE ITEMS (UNGRANTED)</text>
        <text x="14" y="140" font-family="'IBM Plex Mono', monospace" font-size="10.5" fill="#7ea0e8">&#128274; 0x7c9410ef391b... (Opaque Digest Only)</text>

        <!-- Opaque Field 4 -->
        <rect y="156" width="390" height="44" rx="4" fill="#141822" stroke="#222b3d" />
        <text x="14" y="176" font-family="'IBM Plex Sans', sans-serif" font-size="10.5" fill="#9aa2ae">FIELD: MEMO &amp; DESCRIPTIONS (UNGRANTED)</text>
        <text x="14" y="192" font-family="'IBM Plex Mono', monospace" font-size="10.5" fill="#7ea0e8">&#128274; 0x1a82fbc04921... (Opaque Digest Only)</text>

        <!-- Guarantee Note -->
        <rect y="210" width="390" height="65" rx="4" fill="#0f141f" stroke="#1a2436" />
        <text x="12" y="230" font-family="'IBM Plex Sans', sans-serif" font-size="10.5" fill="#e7e9ed">Zero-Knowledge Containment Guarantee:</text>
        <text x="12" y="246" font-family="'IBM Plex Sans', sans-serif" font-size="10" fill="#9aa2ae">Auditor receives mathematical proof that line items fold into the on-chain root, without learning what the line items are.</text>
      </g>
    </g>
  </g>
</svg>
