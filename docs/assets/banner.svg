<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090b" />
      <stop offset="50%" stop-color="#0e121a" />
      <stop offset="100%" stop-color="#141824" />
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7ea0e8" stop-opacity="0" />
      <stop offset="25%" stop-color="#7ea0e8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#a4bdf5" stop-opacity="1" />
      <stop offset="75%" stop-color="#7ea0e8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#7ea0e8" stop-opacity="0" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#222838" stroke-width="0.75" stroke-opacity="0.5" />
      <circle cx="40" cy="40" r="1" fill="#7ea0e8" fill-opacity="0.25" />
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" fill="url(#bgGrad)" />
  <rect width="1200" height="360" fill="url(#grid)" />

  <!-- Subtle ambient glow -->
  <circle cx="600" cy="180" r="280" fill="#3e63b8" fill-opacity="0.09" filter="url(#glow)" />
  <circle cx="200" cy="80" r="120" fill="#7ea0e8" fill-opacity="0.04" filter="url(#glow)" />

  <!-- Border Frame -->
  <rect x="16" y="16" width="1168" height="328" rx="12" fill="none" stroke="#222838" stroke-width="1.5" />
  <line x1="16" y1="16" x2="1184" y2="16" stroke="url(#accentLine)" stroke-width="2.5" />

  <!-- Eyebrow Badge -->
  <g transform="translate(600, 68)">
    <rect x="-140" y="-16" width="280" height="32" rx="16" fill="#101522" stroke="#3e63b8" stroke-width="1.2" stroke-opacity="0.6" />
    <circle cx="-116" cy="0" r="4" fill="#6cbb8e" />
    <text x="-98" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#7ea0e8" letter-spacing="1.5">MIDNIGHT BUILDATHON &middot; WAVE 1</text>
  </g>

  <!-- Title / Brand -->
  <text x="600" y="152" font-family="'Newsreader', Georgia, 'Times New Roman', serif" font-size="62" font-weight="500" fill="#ffffff" text-anchor="middle" letter-spacing="-1">
    Quiet<tspan fill="#7ea0e8" font-style="italic">Books</tspan>
  </text>

  <!-- Tagline -->
  <text x="600" y="202" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#e7e9ed" text-anchor="middle" letter-spacing="-0.2">
    Private B2B Invoicing, Shielded Settlement &amp; Selective Audit on Midnight
  </text>
  
  <text x="600" y="234" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="14.5" font-weight="400" fill="#9aa2ae" text-anchor="middle" letter-spacing="0.2">
    The amount never touches the chain. The proof never leaves it.
  </text>

  <!-- Tech Metric Badges inside Banner -->
  <g transform="translate(600, 290)">
    <!-- Pill 1: Compact 0.23 -->
    <g transform="translate(-360, 0)">
      <rect x="-70" y="-14" width="140" height="28" rx="6" fill="#101522" stroke="#222838" stroke-width="1" />
      <text x="0" y="5" font-family="'IBM Plex Mono', monospace" font-size="11.5" font-weight="500" fill="#9aa2ae" text-anchor="middle">Compact 0.23</text>
    </g>
    <!-- Pill 2: 285 Unit Tests -->
    <g transform="translate(-180, 0)">
      <rect x="-75" y="-14" width="150" height="28" rx="6" fill="#101522" stroke="#222838" stroke-width="1" />
      <text x="0" y="5" font-family="'IBM Plex Mono', monospace" font-size="11.5" font-weight="500" fill="#6cbb8e" text-anchor="middle">&#10003; 285 Unit Tests</text>
    </g>
    <!-- Pill 3: 27/27 E2E ZK Steps -->
    <g transform="translate(0, 0)">
      <rect x="-80" y="-14" width="160" height="28" rx="6" fill="#101522" stroke="#222838" stroke-width="1" />
      <text x="0" y="5" font-family="'IBM Plex Mono', monospace" font-size="11.5" font-weight="500" fill="#7ea0e8" text-anchor="middle">&#9889; 27/27 E2E Real ZK</text>
    </g>
    <!-- Pill 4: Two-Party Transfer -->
    <g transform="translate(180, 0)">
      <rect x="-80" y="-14" width="160" height="28" rx="6" fill="#101522" stroke="#222838" stroke-width="1" />
      <text x="0" y="5" font-family="'IBM Plex Mono', monospace" font-size="11.5" font-weight="500" fill="#6cbb8e" text-anchor="middle">&#10003; 15/15 2-Party Settle</text>
    </g>
    <!-- Pill 5: Apache-2.0 -->
    <g transform="translate(355, 0)">
      <rect x="-65" y="-14" width="130" height="28" rx="6" fill="#101522" stroke="#222838" stroke-width="1" />
      <text x="0" y="5" font-family="'IBM Plex Mono', monospace" font-size="11.5" font-weight="500" fill="#9aa2ae" text-anchor="middle">Apache-2.0</text>
    </g>
  </g>
</svg>
