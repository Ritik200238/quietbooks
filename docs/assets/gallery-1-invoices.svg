<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b0e14" />
      <stop offset="100%" stop-color="#07080c" />
    </linearGradient>
    <filter id="winShadow">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.6" />
    </filter>
  </defs>

  <rect width="1000" height="600" fill="url(#bgG)" rx="12" stroke="#1b2130" stroke-width="1.5" />

  <!-- Browser Chrome / Window bar -->
  <rect width="1000" height="42" fill="#121622" rx="12" />
  <circle cx="24" cy="21" r="5" fill="#d97b72" />
  <circle cx="40" cy="21" r="5" fill="#d3a55c" />
  <circle cx="56" cy="21" r="5" fill="#6cbb8e" />
  <rect x="250" y="10" width="500" height="22" rx="6" fill="#080a0f" stroke="#1f283d" stroke-width="1" />
  <text x="500" y="25" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#7ea0e8" text-anchor="middle">https://quietbooks.network/invoices &middot; Connected: 0x93f...48b (Lace)</text>

  <!-- Content Container -->
  <g transform="translate(40, 60)">
    <!-- Top Header & Filter Bar -->
    <text x="0" y="28" font-family="'Newsreader', Georgia, serif" font-size="28" font-weight="500" fill="#ffffff">Invoices Dashboard</text>
    <text x="0" y="48" font-family="'IBM Plex Sans', sans-serif" font-size="12" fill="#9aa2ae">Dual-Ledger view: Active invoices on Midnight localnet &middot; Pseudonymous keys with hidden terms</text>

    <!-- Stat widgets -->
    <g transform="translate(0, 65)">
      <!-- Widget 1 -->
      <rect width="210" height="64" rx="8" fill="#101522" stroke="#1f283d" stroke-width="1" />
      <text x="14" y="24" font-family="'IBM Plex Sans', sans-serif" font-size="11" fill="#9aa2ae">TOTAL RECORDED</text>
      <text x="14" y="50" font-family="'IBM Plex Mono', monospace" font-size="20" font-weight="600" fill="#ffffff">18 Invoices</text>

      <!-- Widget 2 -->
      <rect x="230" width="210" height="64" rx="8" fill="#101522" stroke="#1f283d" stroke-width="1" />
      <text x="244" y="24" font-family="'IBM Plex Sans', sans-serif" font-size="11" fill="#6cbb8e">SETTLED (SHIELDED)</text>
      <text x="244" y="50" font-family="'IBM Plex Mono', monospace" font-size="20" font-weight="600" fill="#6cbb8e">12 Settled</text>

      <!-- Widget 3 -->
      <rect x="460" width="210" height="64" rx="8" fill="#101522" stroke="#1f283d" stroke-width="1" />
      <text x="474" y="24" font-family="'IBM Plex Sans', sans-serif" font-size="11" fill="#d3a55c">ESCROW LOCKED</text>
      <text x="474" y="50" font-family="'IBM Plex Mono', monospace" font-size="20" font-weight="600" fill="#d3a55c">4 In Escrow</text>

      <!-- Action Button -->
      <rect x="710" width="210" height="64" rx="8" fill="#203565" stroke="#3e63b8" stroke-width="1" />
      <text x="815" y="38" font-family="'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">+ Create New Invoice</text>
    </g>

    <!-- Table Container -->
    <g transform="translate(0, 150)">
      <rect width="920" height="320" rx="8" fill="#0d111a" stroke="#1c2438" stroke-width="1" />
      
      <!-- Table Header -->
      <rect width="920" height="38" rx="8" fill="#141926" />
      <text x="20" y="24" font-family="'IBM Plex Sans', sans-serif" font-size="11" font-weight="600" fill="#7ea0e8">INVOICE ID</text>
      <text x="160" y="24" font-family="'IBM Plex Sans', sans-serif" font-size="11" font-weight="600" fill="#7ea0e8">ROLE</text>
      <text x="260" y="24" font-family="'IBM Plex Sans', sans-serif" font-size="11" font-weight="600" fill="#7ea0e8">STATUS</text>
      <text x="400" y="24" font-family="'IBM Plex Sans', sans-serif" font-size="11" font-weight="600" fill="#7ea0e8">COUNTERPARTY</text>
      <text x="600" y="24" font-family="'IBM Plex Sans', sans-serif" font-size="11" font-weight="600" fill="#7ea0e8">DUE DATE</text>
      <text x="750" y="24" font-family="'IBM Plex Sans', sans-serif" font-size="11" font-weight="600" fill="#7ea0e8">AMOUNT</text>

      <!-- Row 1: Owned & Settled -->
      <g transform="translate(0, 38)">
        <rect width="920" height="52" fill="#0f1420" />
        <line x1="0" y1="52" x2="920" y2="52" stroke="#192233" />
        <text x="20" y="30" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#7ea0e8">INV-2026-001</text>
        <text x="160" y="30" font-family="'IBM Plex Sans', sans-serif" font-size="12" fill="#e7e9ed">Seller</text>
        <rect x="260" y="16" width="70" height="22" rx="11" fill="#163825" />
        <text x="295" y="31" font-family="'IBM Plex Sans', sans-serif" font-size="10.5" font-weight="600" fill="#6cbb8e" text-anchor="middle">SETTLED</text>
        <text x="400" y="30" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#9aa2ae">0x7a4...c91 (Buyer)</text>
        <text x="600" y="30" font-family="'IBM Plex Mono', monospace" font-size="11.5" fill="#9aa2ae">2026-09-24</text>
        <text x="750" y="30" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="600" fill="#ffffff">8,400.00 NIGHT</text>
      </g>

      <!-- Row 2: Owned & Open -->
      <g transform="translate(0, 90)">
        <rect width="920" height="52" fill="#0d111a" />
        <line x1="0" y1="52" x2="920" y2="52" stroke="#192233" />
        <text x="20" y="30" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#7ea0e8">INV-2026-002</text>
        <text x="160" y="30" font-family="'IBM Plex Sans', sans-serif" font-size="12" fill="#e7e9ed">Buyer</text>
        <rect x="260" y="16" width="60" height="22" rx="11" fill="#382d16" />
        <text x="290" y="31" font-family="'IBM Plex Sans', sans-serif" font-size="10.5" font-weight="600" fill="#d3a55c" text-anchor="middle">OPEN</text>
        <text x="400" y="30" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#9aa2ae">0x3b1...e10 (Seller)</text>
        <text x="600" y="30" font-family="'IBM Plex Mono', monospace" font-size="11.5" fill="#9aa2ae">2026-09-30</text>
        <text x="750" y="30" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="600" fill="#ffffff">3,250.00 NIGHT</text>
      </g>

      <!-- Row 3: Observer / Private Row (Privacy in Action!) -->
      <g transform="translate(0, 142)">
        <rect width="920" height="52" fill="#0f1420" />
        <line x1="0" y1="52" x2="920" y2="52" stroke="#192233" />
        <text x="20" y="30" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#7ea0e8">INV-2026-003</text>
        <text x="160" y="30" font-family="'IBM Plex Sans', sans-serif" font-size="12" fill="#77808f">Observer</text>
        <rect x="260" y="16" width="60" height="22" rx="11" fill="#382d16" />
        <text x="290" y="31" font-family="'IBM Plex Sans', sans-serif" font-size="10.5" font-weight="600" fill="#d3a55c" text-anchor="middle">OPEN</text>
        <text x="400" y="30" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#9aa2ae">0x5f9...aa2</text>
        <text x="600" y="30" font-family="'IBM Plex Mono', monospace" font-size="11.5" fill="#9aa2ae">2026-10-05</text>
        <rect x="750" y="15" width="135" height="24" rx="4" fill="#141c2c" stroke="#22304f" />
        <text x="817" y="31" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#7ea0e8" text-anchor="middle">&#128274; Amount Hidden</text>
      </g>

      <!-- Row 4: Escrow Funded -->
      <g transform="translate(0, 194)">
        <rect width="920" height="52" fill="#0d111a" />
        <line x1="0" y1="52" x2="920" y2="52" stroke="#192233" />
        <text x="20" y="30" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#7ea0e8">INV-2026-004</text>
        <text x="160" y="30" font-family="'IBM Plex Sans', sans-serif" font-size="12" fill="#e7e9ed">Buyer</text>
        <rect x="260" y="16" width="70" height="22" rx="11" fill="#3a1e1e" />
        <text x="295" y="31" font-family="'IBM Plex Sans', sans-serif" font-size="10.5" font-weight="600" fill="#d97b72" text-anchor="middle">ESCROW</text>
        <text x="400" y="30" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#9aa2ae">Arbiter: 0x81e...91b</text>
        <text x="600" y="30" font-family="'IBM Plex Mono', monospace" font-size="11.5" fill="#9aa2ae">2026-10-15</text>
        <text x="750" y="30" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="600" fill="#d3a55c">15,000.00 (Public)</text>
      </g>

      <!-- Row 5: Overdue -->
      <g transform="translate(0, 246)">
        <rect width="920" height="52" fill="#0f1420" />
        <text x="20" y="30" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#7ea0e8">INV-2026-005</text>
        <text x="160" y="30" font-family="'IBM Plex Sans', sans-serif" font-size="12" fill="#e7e9ed">Seller</text>
        <rect x="260" y="16" width="75" height="22" rx="11" fill="#42251a" />
        <text x="297" y="31" font-family="'IBM Plex Sans', sans-serif" font-size="10.5" font-weight="600" fill="#e07a5f" text-anchor="middle">OVERDUE</text>
        <text x="400" y="30" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#9aa2ae">0x12d...74f (Buyer)</text>
        <text x="600" y="30" font-family="'IBM Plex Mono', monospace" font-size="11.5" fill="#e07a5f">2026-09-10</text>
        <text x="750" y="30" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="600" fill="#ffffff">1,800.00 NIGHT</text>
      </g>
    </g>
  </g>
</svg>
