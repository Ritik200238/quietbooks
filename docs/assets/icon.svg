<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1320" />
      <stop offset="50%" stop-color="#121829" />
      <stop offset="100%" stop-color="#080a10" />
    </linearGradient>
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7ea0e8" />
      <stop offset="50%" stop-color="#3e63b8" />
      <stop offset="100%" stop-color="#2a3f78" />
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e263d" />
      <stop offset="100%" stop-color="#131826" />
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6cbb8e" />
      <stop offset="100%" stop-color="#7ea0e8" />
    </linearGradient>
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#7ea0e8" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="256" height="256" rx="56" fill="url(#iconBg)" stroke="#222b42" stroke-width="2" />

  <!-- Shield Outline Base -->
  <g transform="translate(128, 128)" filter="url(#iconShadow)">
    <!-- Outer Shield Frame -->
    <path d="M 0 -85 
             C 45 -85, 75 -75, 75 -75 
             C 75 15, 55 60, 0 92 
             C -55 60, -75 15, -75 -75 
             C -75 -75, -45 -85, 0 -85 Z" 
          fill="url(#pageGrad)" 
          stroke="url(#shieldBorder)" 
          stroke-width="5" />

    <!-- Ledger / Book Silhouette inside Shield -->
    <!-- Spine / Center seam -->
    <line x1="0" y1="-50" x2="0" y2="40" stroke="#3e63b8" stroke-width="2.5" stroke-dasharray="3,3" />

    <!-- Left Ledger Page lines (representing commercial terms & math) -->
    <path d="M -48 -42 L -12 -42" stroke="#4a5980" stroke-width="3" stroke-linecap="round" />
    <path d="M -48 -24 L -12 -24" stroke="#4a5980" stroke-width="3" stroke-linecap="round" />
    <path d="M -48 -6 L -20 -6" stroke="#4a5980" stroke-width="3" stroke-linecap="round" />
    <path d="M -48 12 L -14 12" stroke="#4a5980" stroke-width="3" stroke-linecap="round" />

    <!-- Right Ledger Page with cryptographic lock / check -->
    <path d="M 12 -42 L 48 -42" stroke="#4a5980" stroke-width="3" stroke-linecap="round" />
    <path d="M 12 -24 L 38 -24" stroke="#4a5980" stroke-width="3" stroke-linecap="round" />

    <!-- Golden/Emerald Zero-Knowledge Keyhole / Node -->
    <circle cx="0" cy="10" r="14" fill="#101524" stroke="url(#neonGlow)" stroke-width="3.5" />
    <path d="M -3 10 L 3 10 L 4 23 L -4 23 Z" fill="url(#neonGlow)" />
    
    <!-- ZK Proof Star / Sparkle on top right -->
    <path d="M 40 -60 Q 40 -48 52 -48 Q 40 -48 40 -36 Q 40 -48 28 -48 Q 40 -48 40 -60 Z" fill="#6cbb8e" />
  </g>
</svg>
