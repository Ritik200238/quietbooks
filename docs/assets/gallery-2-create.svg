<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgG2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b0e14" />
      <stop offset="100%" stop-color="#07080c" />
    </linearGradient>
  </defs>

  <rect width="1000" height="600" fill="url(#bgG2)" rx="12" stroke="#1b2130" stroke-width="1.5" />

  <!-- Browser Chrome -->
  <rect width="1000" height="42" fill="#121622" rx="12" />
  <circle cx="24" cy="21" r="5" fill="#d97b72" />
  <circle cx="40" cy="21" r="5" fill="#d3a55c" />
  <circle cx="56" cy="21" r="5" fill="#6cbb8e" />
  <rect x="250" y="10" width="500" height="22" rx="6" fill="#080a0f" stroke="#1f283d" stroke-width="1" />
  <text x="500" y="25" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#7ea0e8" text-anchor="middle">https://quietbooks.network/invoices/new &middot; Role: Supplier</text>

  <!-- Container -->
  <g transform="translate(40, 60)">
    <text x="0" y="28" font-family="'Newsreader', Georgia, serif" font-size="28" font-weight="500" fill="#ffffff">Issue Confidential Invoice</text>
    <text x="0" y="48" font-family="'IBM Plex Sans', sans-serif" font-size="12" fill="#9aa2ae">All commercial details are hashed locally into witness commitments. No plaintexts hit the mempool.</text>

    <!-- Form Grid -->
    <g transform="translate(0, 65)">
      <!-- Left Column: Parties & Timing -->
      <rect width="440" height="400" rx="8" fill="#0d111a" stroke="#1c2438" stroke-width="1" />
      <text x="20" y="32" font-family="'IBM Plex Sans', sans-serif" font-size="14" font-weight="600" fill="#7ea0e8">1. Counterparties &amp; Payout Routing</text>

      <!-- Field: Buyer Key -->
      <text x="20" y="65" font-family="'IBM Plex Sans', sans-serif" font-size="11" fill="#9aa2ae">BUYER PARTY KEY (32 BYTES HEX)</text>
      <rect x="20" y="75" width="400" height="34" rx="4" fill="#121724" stroke="#222f47" />
      <text x="32" y="97" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#e7e9ed">0x7a4c910283f6be1209e74218a002bc45...</text>

      <!-- Field: Seller Payout -->
      <text x="20" y="130" font-family="'IBM Plex Sans', sans-serif" font-size="11" fill="#9aa2ae">SELLER PAYOUT SHIELDED ADDRESS</text>
      <rect x="20" y="140" width="400" height="34" rx="4" fill="#121724" stroke="#222f47" />
      <text x="32" y="162" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#6cbb8e">0x48ae91c01b2289f032aa87d19208311...</text>
      <text x="20" y="186" font-family="'IBM Plex Sans', sans-serif" font-size="10" fill="#6cbb8e">&#10003; Bound in-circuit: settleWithNote refuses all other destinations</text>

      <!-- Field: Buyer Payout (Dispute fallback) -->
      <text x="20" y="215" font-family="'IBM Plex Sans', sans-serif" font-size="11" fill="#9aa2ae">BUYER REFUND / DISPUTE ADDRESS</text>
      <rect x="20" y="225" width="400" height="34" rx="4" fill="#121724" stroke="#222f47" />
      <text x="32" y="247" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#e7e9ed">0x12bf023910cbe7781a98214fa450198...</text>

      <!-- Field: Due Date & Token -->
      <text x="20" y="285" font-family="'IBM Plex Sans', sans-serif" font-size="11" fill="#9aa2ae">PAYMENT DEADLINE</text>
      <rect x="20" y="295" width="190" height="34" rx="4" fill="#121724" stroke="#222f47" />
      <text x="32" y="317" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#e7e9ed">2026-10-15 18:00</text>

      <text x="230" y="285" font-family="'IBM Plex Sans', sans-serif" font-size="11" fill="#9aa2ae">PAYABLE TOKEN</text>
      <rect x="230" y="295" width="190" height="34" rx="4" fill="#121724" stroke="#222f47" />
      <text x="242" y="317" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#e7e9ed">Native NIGHT (Zswap)</text>

      <!-- Arbiter (Optional) -->
      <text x="20" y="352" font-family="'IBM Plex Sans', sans-serif" font-size="11" fill="#9aa2ae">DESIGNATED ARBITER (ESCROW ONLY)</text>
      <rect x="20" y="360" width="400" height="28" rx="4" fill="#121724" stroke="#222f47" />
      <text x="32" y="378" font-family="'IBM Plex Mono', monospace" font-size="10.5" fill="#77808f">0x81e91b... (Optional third-party resolver)</text>

      <!-- Right Column: Line Items & Commitment Preview -->
      <rect x="470" width="450" height="400" rx="8" fill="#0d111a" stroke="#1c2438" stroke-width="1" />
      <text x="490" y="32" font-family="'IBM Plex Sans', sans-serif" font-size="14" font-weight="600" fill="#7ea0e8">2. Private Commercial Terms</text>

      <!-- Line Item 1 -->
      <rect x="490" y="55" width="410" height="50" rx="4" fill="#121724" stroke="#222f47" />
      <text x="502" y="75" font-family="'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="600" fill="#ffffff">Smart Contract Security Audit &middot; Wave 1</text>
      <text x="502" y="93" font-family="'IBM Plex Mono', monospace" font-size="10.5" fill="#9aa2ae">100 hrs @ 70.00 NIGHT = 7,000.00 NIGHT</text>

      <!-- Line Item 2 -->
      <rect x="490" y="112" width="410" height="50" rx="4" fill="#121724" stroke="#222f47" />
      <text x="502" y="132" font-family="'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="600" fill="#ffffff">Zero-Knowledge Circuit Optimization</text>
      <text x="502" y="150" font-family="'IBM Plex Mono', monospace" font-size="10.5" fill="#9aa2ae">20 hrs @ 70.00 NIGHT = 1,400.00 NIGHT</text>

      <!-- Summary box -->
      <g transform="translate(490, 175)">
        <rect width="410" height="120" rx="6" fill="#101522" stroke="#222f47" />
        <text x="16" y="24" font-family="'IBM Plex Sans', sans-serif" font-size="11" fill="#9aa2ae">SUBTOTAL</text>
        <text x="394" y="24" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#ffffff" text-anchor="end">8,400.00 NIGHT</text>

        <text x="16" y="48" font-family="'IBM Plex Sans', sans-serif" font-size="11" fill="#9aa2ae">TAX / VAT (10%)</text>
        <text x="394" y="48" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#ffffff" text-anchor="end">840.00 NIGHT</text>

        <line x1="16" y1="60" x2="394" y2="60" stroke="#1d2638" />

        <text x="16" y="84" font-family="'IBM Plex Sans', sans-serif" font-size="12" font-weight="600" fill="#7ea0e8">TOTAL INVOICE COMMITMENT</text>
        <text x="394" y="84" font-family="'IBM Plex Mono', monospace" font-size="16" font-weight="600" fill="#6cbb8e" text-anchor="end">9,240.00 NIGHT</text>
        <text x="16" y="105" font-family="'IBM Plex Mono', monospace" font-size="9.5" fill="#9aa2ae">9 independent blinding salts generated locally</text>
      </g>

      <!-- Submit button -->
      <rect x="490" y="325" width="410" height="52" rx="6" fill="#203565" stroke="#3e63b8" />
      <text x="695" y="357" font-family="'IBM Plex Sans', sans-serif" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">&#128274; Sign &amp; Anchor on Midnight (ZK Proof)</text>
    </g>
  </g>
</svg>
